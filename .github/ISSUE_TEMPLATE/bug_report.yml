name: Bug Report
description: Report a reproducible bug or crash in YumaPlayer
labels: [BUG]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve YumaPlayer!

        Before submitting, verify the bug on the latest Canary build whenever possible. Stable/Beta releases may already contain bugs fixed in newer Canary builds, so stable-only reports need a clear reason and may be closed if they cannot be reproduced on Canary.

  - type: checkboxes
    id: pre-submission-checklist
    attributes:
      label: Required pre-submission checklist
      description: Reports that skip these checks are difficult to triage and may be closed.
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I tested this bug on the latest available build (preferably Canary).
          required: true
        - label: This report describes one specific bug, not multiple unrelated problems.
          required: true
        - label: The issue title names the affected area and the broken behavior clearly.
          required: true

  - type: dropdown
    id: release-channel
    attributes:
      label: Release channel
      description: Select the build channel where you reproduced the bug.
      options:
        - Canary / Actions build
        - Beta
        - Stable
        - Debug / Local build
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: YumaPlayer version & build
      description: Found in Settings -> About, or commit hash / APK name.
      placeholder: "Example: 1.1.0-Canary|Beta|Stable, commit c09ded0, or v1.0.5"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected area
      description: Select the main area where the bug happens.
      options:
        - Music player / now playing / miniplayer
        - Playback queue / radio / cache
        - Library / playlists / local media / FLAC
        - Search / browse / YouTube data
        - Lyrics / translation / sync
        - UI / canvas animations / Haze glass / theme
        - Settings / appearance / sound
        - Integrations / Spotify / Discord / Last.fm
        - Crash / startup / performance
        - Other
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Reproducibility
      description: How often can you reproduce this bug?
      options:
        - Every time
        - Often
        - Sometimes
        - Rarely
        - Once, but with logs or crash evidence
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Provide exact step-by-step instructions.
      placeholder: |
        1. Open YumaPlayer.
        2. Go to ...
        3. Tap ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: behavior-comparison
    attributes:
      label: Expected vs actual behavior
      description: Describe what should happen and what actually happens.
      placeholder: |
        Expected:

        Actual:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Crash trace
      description: >
        Paste relevant adb logcat output or crash stack trace.
        Make sure to remove any private tokens or account identifiers.
      placeholder: "Paste logcat output here..."

  - type: textarea
    id: visual-evidence
    attributes:
      label: Screenshots or screen recordings (optional)
      description: Attach screenshots or screen recordings showing UI/rendering bugs.
      placeholder: "Attach files here or describe the visual issue."

  - type: dropdown
    id: android-version
    attributes:
      label: Android version
      options:
        - Android 17
        - Android 16
        - Android 15
        - Android 14
        - Android 13
        - Android 12
        - Android 11
        - Android 10 or older
        - Custom ROM
    validations:
      required: true

  - type: input
    id: device-model
    attributes:
      label: Device model
      description: Include manufacturer, model, and ROM if relevant.
      placeholder: "Example: Samsung Galaxy S23, Pixel 7, Xiaomi (HyperOS)"
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Mention background animation type, Haze blur state, network type (Wi-Fi/cellular), VPN, or audio formats.
      placeholder: "Example: Happens only when Particles animation is active and blur is enabled."