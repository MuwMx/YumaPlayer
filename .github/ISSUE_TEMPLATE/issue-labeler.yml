name: Issue Auto Labeler

on:
  issues:
    types: [opened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Auto-assign labels based on category
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const labelsToAdd = [];

            const categoryMap = {
              '✨ New Feature': 'feature',
              '🎨 UI / Visuals': 'ui',
              '🎛️ Player / Playback & Queue': 'player',
              '⚡ Performance / Optimization': 'performance',
              '🎧 Audio Experience / Formats': 'audio',
              '🌐 Translation / Localization': 'localization',
              'Music player / now playing': 'player',
              'Playback queue / radio / cache': 'queue',
              'UI / canvas animations / Haze glass / theme': 'ui',
              'Lyrics / translation / sync': 'lyrics',
              'Crash / startup': 'crash'
            };

            for (const [key, label] of Object.entries(categoryMap)) {
              if (body.includes(key)) {
                labelsToAdd.push(label);
              }
            }

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: labelsToAdd
              });
            }